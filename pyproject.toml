[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-workbench"
version = "0.1.0"
description = "A resumable, resource-bounded local AI batch-work runner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sujan Reddy" }]
dependencies = ["textual>=1.0,<2.0", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.5"]

[project.scripts]
local-workbench = "local_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["local_workbench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
