[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-workbench"
version = "0.1.1"
description = "A resumable, resource-bounded local AI batch-work runner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sujan Reddy" }]
dependencies = ["textual>=1.0,<2.0", "psutil>=5.9"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/sujan-reddy-p/local-workbench"
Repository = "https://github.com/sujan-reddy-p/local-workbench"
Issues = "https://github.com/sujan-reddy-p/local-workbench/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.5"]

[project.scripts]
local-workbench = "local_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["local_workbench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
